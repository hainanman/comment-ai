{% extends "base.html" %}
{% block title %}注册 · {{ app_name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h2>注册普通用户</h2>
        <p class="text-muted">审核员/管理员账号由管理员创建，不开放自助注册。</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <input class="form-control" id="username" name="username" value="{{ username or '' }}" minlength="3" maxlength="50" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <input class="form-control" id="password" name="password" type="password" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm">确认密码</label>
            <input class="form-control" id="confirm" name="confirm" type="password" minlength="6" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">注册</button>
        </form>
        <p class="mt-3 mb-0 text-muted small">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
