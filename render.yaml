services:
  - type: web
    name: comment-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: AI_MODEL
        value: qwen-plus
      - key: AI_ENABLED
        value: "true"
      - key: LLM_TIMEOUT
        value: "25"
      - key: DAILY_LLM_LIMIT
        value: "2000"
      - key: LOG_LEVEL
        value: INFO
      - key: TZ
        value: Asia/Shanghai
